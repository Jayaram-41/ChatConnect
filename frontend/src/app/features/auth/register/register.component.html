<div class="auth-card">
  <div class="auth-header">
    <div class="brand-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7.5" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="23" y1="11" x2="17" y2="11"></line>
      </svg>
    </div>
    <h2>Create Account</h2>
    <p class="subtitle">Join ChatConnect to connect with friends & colleagues</p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-error" role="alert">
    <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span>{{ errorMessage }}</span>
  </div>

  <div *ngIf="successMessage" class="alert alert-success" role="alert">
    <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span>{{ successMessage }}</span>
  </div>

  <form (ngSubmit)="onSubmit()" class="auth-form" novalidate>
    <!-- Username Field -->
    <div class="form-group">
      <label for="reg-username">Username</label>
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input
          id="reg-username"
          name="username"
          type="text"
          [(ngModel)]="username"
          placeholder="Choose a unique username"
          required
          autocomplete="username"
          [disabled]="isLoading"
        />
      </div>
    </div>

    <!-- Password Field -->
    <div class="form-group">
      <label for="reg-password">Password</label>
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input
          id="reg-password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="At least 6 characters"
          required
          autocomplete="new-password"
          [disabled]="isLoading"
        />
        <button
          type="button"
          class="toggle-password-btn"
          (click)="togglePasswordVisibility()"
          [title]="showPassword ? 'Hide password' : 'Show password'"
          tabindex="-1"
        >
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Confirm Password Field -->
    <div class="form-group">
      <label for="reg-confirm-password">Confirm Password</label>
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input
          id="reg-confirm-password"
          name="confirmPassword"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          placeholder="Re-enter your password"
          required
          autocomplete="new-password"
          [disabled]="isLoading"
        />
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="submit-btn" [disabled]="isLoading">
      <span *ngIf="!isLoading">Create Account</span>
      <span *ngIf="isLoading" class="spinner-wrapper">
        <svg class="spinner" viewBox="0 0 50 50">
          <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
        </svg>
        Creating account...
      </span>
    </button>
  </form>

  <!-- Hyperlink back to login -->
  <div class="auth-footer">
    <p>
      Already have an account?
      <a routerLink="/login" class="register-link" id="login-hyperlink">
        Sign in here
      </a>
    </p>
  </div>
</div>
